<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KnowNet</title>
<style>
:root{--bg:#F8F9FB;--card:#fff;--ink:#1a1a2e;--soft:#6b7280;--accent:#4F46E5;--border:#e5e7eb;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.box{background:var(--card);border-radius:20px;padding:32px 24px;width:340px;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center}
.box h1{font-size:24px;font-weight:800;margin-bottom:4px}
.box .sub{font-size:13px;color:var(--soft);margin-bottom:20px;line-height:1.6}
.box input,.box textarea{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:15px;outline:none;transition:border-color .2s;margin-bottom:8px;box-sizing:border-box;font-family:inherit}
.box input{text-align:center}
.box input:focus,.box textarea:focus{border-color:var(--accent)}
.box input[type=password]{letter-spacing:2px}
.box textarea{resize:vertical;min-height:80px;text-align:left}
.box button{width:100%;padding:14px;margin-top:8px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer}
.box button:active{opacity:.8}
.box .err{color:#DC2626;font-size:13px;margin-top:4px}
.box .ok{color:#059669;font-size:14px;margin-top:4px;font-weight:600}
.box .hint{font-size:11px;color:var(--soft);margin-top:8px;line-height:1.5}
.box .link{font-size:13px;color:var(--accent);text-decoration:none;margin-top:16px;display:block}
.box .lang-switch{font-size:11px;color:var(--soft);margin-top:16px}
.box .lang-switch a{color:var(--accent);text-decoration:none}
.box .hook{font-size:13px;color:#4F46E5;background:#EEF2FF;border-radius:10px;padding:10px 14px;margin-bottom:16px;line-height:1.6;text-align:left}
</style>
</head>
<body>
<div class="box">
  <h1>KnowNet</h1>
  <div class="sub">{{ T('register_title') }}</div>
  <div class="hook">{{ T('apply_hook') }}</div>
  {% if ok %}
  <div class="ok">{{ ok }}</div>
  <div class="hint">{{ T('apply_after') }}</div>
  <a href="/login" class="link">{{ T('register_login_link') }}</a>
  {% else %}
  <form method="POST">
    <input type="text" name="username" placeholder="{{ T('register_username') }}" value="{{ request.form.get('username', '') }}" autofocus>
    <input type="password" name="password" placeholder="{{ T('register_password') }}">
    <input type="password" name="password2" placeholder="{{ T('register_password2') }}">
    <textarea name="reason" placeholder="{{ T('apply_reason') }}">{{ request.form.get('reason', '') }}</textarea>
    <input type="text" name="source" placeholder="{{ T('apply_source') }}" value="{{ request.form.get('source', '') }}">
    <button type="submit">{{ T('apply_btn') }}</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
  <div class="hint">{{ T('register_login_hint') }} <a href="/login" style="color:var(--accent)">{{ T('register_login_link') }}</a></div>
  {% endif %}
  <div class="lang-switch">
    <a href="?lang={{ 'zh' if lang == 'en' else 'en' }}">{{ T('switch_lang') }}</a>
  </div>
</div>
</body>
</html>
